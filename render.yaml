services:
  - type: web
    name: tastepilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: QLOO_API_KEY
        sync: false   # set in the Render dashboard; never commit
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: ALLOW_DEV_MODE
        value: "0"
      # Optional (not needed for the Qloo-backed experience):
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
